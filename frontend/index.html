<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ATRRIC | Tactical Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

<style>
  :root { 
    --bg-app: #000000; 
    --bg-panel: rgba(18, 18, 18, 0.85); /* Semi-transparent for floating look */
    --border: #333333; 
    --text-main: #EDEDED; 
    --text-muted: #888888; 
    --accent: #FFFFFF; /* Pure white for premium look */
    --font-mono: 'JetBrains Mono', monospace; 
  }
  
  body { background-color: var(--bg-app); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; margin: 0; }
  .mono { font-family: var(--font-mono); }

  /* MAP FULL SCREEN */
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 1; background: #000; }
  
  /* HOLOGRAM OVERLAY (Grid & Scanlines) */
  .map-overlay {
    position: absolute; inset: 0; pointer-events: none; z-index: 400;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
  }

  /* CORNER BRACKETS (Tactical Vibe) */
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.4); z-index: 450; pointer-events: none; }
  .corner-tl { top: 16px; left: 16px; border-right: none; border-bottom: none; }
  .corner-tr { top: 16px; right: 16px; border-left: none; border-bottom: none; }
  .corner-bl { bottom: 80px; left: 16px; border-right: none; border-top: none; }
  .corner-br { bottom: 80px; right: 16px; border-left: none; border-top: none; }

  /* FLOATING HUD PANELS */
  .hud-panel {
    position: absolute; z-index: 500; pointer-events: none;
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: 4px;
    padding: 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);
  }
  .hud-title { color: var(--accent); font-weight: bold; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
  
  /* BOTTOM NAV */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: rgba(10,10,10,0.95); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1000; padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(10px); }
  .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); font-size: 9px; font-family: var(--font-mono); gap: 4px; cursor: pointer; width: 100%; height: 100%; transition: color 0.2s; }
  .nav-btn.active { color: var(--accent); }
  .nav-btn svg { width: 20px; height: 20px; }

  /* MAPLIBRE POPUP CUSTOMIZATION */
  .maplibregl-popup-content { background: #111 !important; color: #fff !important; border: 1px solid #333 !important; border-radius: 4px !important; font-family: 'JetBrains Mono', monospace !important; font-size: 11px !important; box-shadow: 0 10px 30px rgba(0,0,0,0.8) !important; padding: 12px !important; }
  .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: #111 !important; }
  .maplibregl-popup-close-button { color: #888 !important; font-size: 16px !important; padding: 4px 8px !important; }
</style>
</head>
<body>

  <!-- MAP CONTAINER -->
  <div id="map"></div>
  
  <!-- OVERLAYS -->
  <div class="map-overlay"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- TOP LEFT HUD -->
  <div class="hud-panel top-6 left-8" style="width: 220px;">
    <div class="hud-title">[ SYSTEM STATUS ]</div>
    <div class="flex justify-between mt-1"><span>LAT:</span> <span id="hud-lat" class="text-white">3.1390 N</span></div>
    <div class="flex justify-between"><span>LON:</span> <span id="hud-lon" class="text-white">101.6869 E</span></div>
    <div class="flex justify-between mt-2 pt-2 border-t border-[#333]"><span>UPLINK:</span> <span class="text-green-500">SECURE</span></div>
  </div>

  <!-- TOP RIGHT HUD -->
  <div class="hud-panel top-6 right-8 text-right">
    <div class="hud-title">[ DATA SOURCE ]</div>
    <div>SQLITE ENGINE</div>
    <div class="text-white mt-1" id="hud-count">0 RECORDS</div>
    <div class="mt-2 text-[8px] opacity-50">ATRRIC INTEL v2.0</div>
  </div>

  <!-- BOTTOM LEFT LEGEND (Like GlobalPulse) -->
  <div class="hud-panel bottom-24 left-8 pointer-events-auto">
    <div class="hud-title mb-2">[ LEGEND ]</div>
    <div class="flex items-center gap-2 mb-1"><div class="w-2 h-2 rounded-full bg-white"></div> <span>Data Center</span></div>
    <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-red-500"></div> <span>Construction</span></div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <div class="nav-btn active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>MAP</span>
    </div>
    <div class="nav-btn" onclick="alert('Fokus Map Dulu Bro. Tab lain nanti.')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>STATS</span>
    </div>
    <div class="nav-btn" onclick="alert('Fokus Map Dulu Bro.')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8V6Z"/></svg>
      <span>NEWS</span>
    </div>
    <div class="nav-btn" onclick="alert('Fokus Map Dulu Bro.')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>AIP</span>
    </div>
  </nav>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let map;

  // --- INIT MAP (SATELLITE / MONOCHROME) ---
  function initMap() {
    map = new maplibregl.Map({
      container: 'map',
      // Guna style gelap monokrom
      style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      center: [101.6869, 3.1390], // KLCC
      zoom: 11,
      pitch: 60, // Tilt untuk 3D feel
      bearing: -20,
      antialias: true,
      attributionControl: false
    });

    // Add Esri Satellite Layer on top (untuk bagi look real satellite tapi gelap)
    map.on('load', () => {
        map.addSource('satellite', {
            type: 'raster',
            tiles: [
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
            ],
            tileSize: 256
        });
        
        // Letak satellite layer dengan opacity rendah & blend mode supaya nampak tactical
        map.addLayer({
            id: 'satellite-layer',
            type: 'raster',
            source: 'satellite',
            paint: {
                'raster-opacity': 0.4,
                'raster-saturation': -1, // Buang warna (jadi greyscale)
                'raster-contrast': 0.2
            }
        });

        fetchSpatialData();
    });

    // Update Koordinat
    map.on('mousemove', (e) => {
      $('hud-lat').textContent = `${e.lngLat.lat.toFixed(4)} N`;
      $('hud-lon').textContent = `${e.lngLat.lng.toFixed(4)} E`;
    });

    // Zoom Control (Custom position)
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
  }

  // --- FETCH & RENDER DATA ---
  async function fetchSpatialData() {
    try {
      const res = await fetch(`/api/spatial`);
      const payload = await res.json();
      
      const features = payload.data.map(p => ({
        type: 'Feature',
        properties: { id: p.id, name: p.name, type: p.type },
        geometry: { type: 'Point', coordinates: [p.lon, p.lat] }
      }));

      map.addSource('project-data', { type: 'geojson', data: { type: 'FeatureCollection', features } });
      
      // LAYER 1: GLOW (Efek cahaya)
      map.addLayer({
        'id': 'projects-glow',
        'type': 'circle',
        'source': 'project-data',
        'paint': {
          'circle-color': '#ffffff',
          'circle-radius': 12,
          'circle-opacity': 0.15,
          'circle-blur': 1
        }
      });

      // LAYER 2: CORE DOT (Titik utama)
      map.addLayer({
        'id': 'projects-points',
        'type': 'circle',
        'source': 'project-data',
        'paint': {
          'circle-color': '#ffffff', // Putih untuk monokrom premium
          'circle-radius': 4,
          'circle-opacity': 1,
          'circle-stroke-width': 1.5,
          'circle-stroke-color': '#000000'
        }
      });

      // INTERAKSI: Popup Klik
      map.on('click', 'projects-points', (e) => {
        const p = e.features[0].properties;
        
        // Warna ikut type
        let typeColor = '#ffffff';
        if (p.type === 'Construction') typeColor = '#ef4444';

        new maplibregl.Popup({ offset: 10 })
          .setLngLat(e.lngLat)
          .setHTML(`
            <div style="font-family: monospace;">
              <div style="color: #888; font-size: 9px; margin-bottom: 4px;">[ ${p.type.toUpperCase()} ]</div>
              <div style="font-size: 13px; font-weight: bold; color: #fff;">${p.name}</div>
              <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #333; font-size: 9px; color: #888;">
                LAT: ${e.lngLat.lat.toFixed(4)}<br>
                LON: ${e.lngLat.lng.toFixed(4)}
              </div>
            </div>
          `)
          .addTo(map);
      });

      // Hover effect
      map.on('mouseenter', 'projects-points', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'projects-points', () => { map.getCanvas().style.cursor = ''; });

      // Update HUD
      $('hud-count').textContent = `${features.length} RECORDS`;
      
    } catch (e) {
      console.error("DB Error:", e);
      $('hud-count').textContent = "DB OFFLINE";
    }
  }

  // Boot
  initMap();

})();
</script>
</body>
</html>
