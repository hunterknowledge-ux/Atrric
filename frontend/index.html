<!DOCTYPE html>
<html lang="ms" class="bg-[#07090C]">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Atrric | Intel Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg-base: #07090C;
    --bg-panel: #0F141C;
    --border: #1E2A36;
    --accent: #22D3EE;
    --text-main: #E2E8F0;
    --text-muted: #5C7080;
    --font-mono: 'JetBrains Mono', monospace;
  }
  
  body {
    background-color: var(--bg-base);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    /* Blueprint Grid Background */
    background-image: 
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 20px 20px;
    background-position: center;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Typography Utilities */
  .mono { font-family: var(--font-mono); }
  .text-acc { color: var(--accent); }
  .text-muted { color: var(--text-muted); }

  /* Sharp Panels */
  .panel {
    background-color: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 2px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg-base); }
  ::-webkit-scrollbar-thumb { background: var(--border); }

  /* Drawers */
  .drawer {
    position: fixed; top: 0; bottom: 0; width: 280px;
    background: var(--bg-panel); border-right: 1px solid var(--border);
    z-index: 50; transform: translateX(-100%); transition: transform 0.2s ease;
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  
  /* Terminal Input */
  .console-input {
    background: transparent; border: none; outline: none; color: var(--accent);
    font-family: var(--font-mono); width: 100%;
  }
  
  /* Markdown Styles */
  .md-content { font-size: 14px; line-height: 1.6; color: #CBD5E1; }
  .md-content p { margin-bottom: 10px; }
  .md-content strong { color: #F8FAFC; font-weight: 600; }
  .md-content ul { list-style: square; padding-left: 16px; margin-bottom: 10px; }
  .md-content li { margin-bottom: 4px; }
  .md-content code { font-family: var(--font-mono); background: #1E2A36; padding: 2px 4px; border-radius: 2px; font-size: 12px; color: #E2E8F0; }
  .md-content pre { background: #07090C; border: 1px solid var(--border); padding: 10px; overflow-x: auto; margin-bottom: 10px; border-radius: 2px; }
  .md-content pre code { background: transparent; padding: 0; }

  /* Evidence Table */
  .evidence-row {
    display: flex; justify-content: space-between; border-bottom: 1px solid var(--border);
    padding: 6px 0; font-family: var(--font-mono); font-size: 11px;
  }
</style>
</head>
<body>

  <!-- Top Telemetry Bar -->
  <header class="h-8 flex items-center justify-between px-3 border-b border-[#1E2A36] bg-[#0F141C] mono text-[10px] text-[#5C7080] shrink-0 z-40">
    <div class="flex items-center gap-4">
      <span>SYS: <span class="text-[#10B981]">ONLINE</span></span>
      <span>MODE: RAG</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="telemetry-src">SRC: 0</span>
      <span id="telemetry-time">00:00:00</span>
    </div>
  </header>

  <!-- Header Bar -->
  <div class="h-12 flex items-center justify-between px-3 border-b border-[#1E2A36] bg-[#07090C] shrink-0 z-30">
    <div class="flex items-center gap-3">
      <button id="btn-log" class="mono text-[#5C7080] hover:text-[#22D3EE] text-sm">[ LOG ]</button>
      <span class="mono font-bold tracking-widest text-[#E2E8F0]">ATRRIC</span>
    </div>
    <div class="mono text-[10px] text-[#22D3EE] border border-[#1E2A36] px-2 py-1">INTEL CONSOLE</div>
  </div>

  <!-- MAIN WORKSPACE -->
  <main id="workspace" class="flex-1 overflow-y-auto relative p-3 scroll-smooth">
    
    <!-- Empty State -->
    <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center opacity-50 pointer-events-none">
      <div class="mono text-[#22D3EE] text-sm mb-2">[ AWAITING INPUT ]</div>
      <div class="mono text-[#5C7080] text-[10px]">SYSTEM READY FOR QUERY</div>
    </div>

    <!-- Active Report Panel -->
    <div id="report-panel" class="panel hidden flex-col w-full shadow-lg">
      <!-- Panel Header -->
      <div class="h-8 bg-[#090D13] border-b border-[#1E2A36] flex items-center justify-between px-3 mono text-[10px]">
        <span class="text-[#5C7080]">[ REPORT ID: <span id="report-id" class="text-[#E2E8F0]">---</span> ]</span>
        <span class="text-[#5C7080]">[ <span id="report-time">--:--</span> ]</span>
      </div>
      
      <!-- Query Context -->
      <div class="px-3 py-2 bg-[#111822] border-b border-[#1E2A36] mono text-xs text-[#22D3EE]">
        > <span id="report-query"></span>
      </div>

      <!-- Answer Body -->
      <div class="p-3">
        <div id="report-answer" class="md-content"></div>
      </div>

      <!-- Evidence Footer -->
      <div class="border-t border-[#1E2A36] bg-[#090D13] p-3">
        <div class="mono text-[10px] text-[#5C7080] mb-2">EVIDENCE LOG:</div>
        <div id="report-sources" class="flex flex-col"></div>
        
        <!-- Actions -->
        <div class="flex gap-2 mt-4">
           <button id="btn-copy" class="mono text-[10px] text-[#5C7080] hover:text-[#22D3EE] border border-[#1E2A36] px-2 py-1">[ COPY ]</button>
           <button id="btn-rerun" class="mono text-[10px] text-[#5C7080] hover:text-[#22D3EE] border border-[#1E2A36] px-2 py-1">[ RE-RUN ]</button>
        </div>
      </div>
    </div>

    <!-- Error Panel -->
    <div id="error-panel" class="panel border-[#DC2626] hidden flex-col w-full mt-2">
      <div class="h-8 bg-[#DC2626]/10 border-b border-[#DC2626]/30 flex items-center px-3 mono text-[10px] text-[#DC2626]">
        [ SYSTEM ERROR ]
      </div>
      <div class="p-3 mono text-xs text-[#EF4444]" id="error-msg"></div>
    </div>

  </main>

  <!-- BOTTOM CONSOLE INPUT -->
  <footer class="p-3 bg-[#07090C] border-t border-[#1E2A36] shrink-0" style="padding-bottom:max(12px,env(safe-area-inset-bottom))">
    <div class="panel flex items-center h-12 px-3 bg-[#0F141C] focus-within:border-[#22D3EE] transition-colors">
      <span class="mono text-[#22D3EE] mr-2 text-sm">&gt;</span>
      <input type="text" id="cmd-input" class="console-input text-sm" placeholder="enter query..." autocomplete="off" spellcheck="false">
      <button id="btn-exec" class="mono text-[10px] text-[#E2E8F0] border border-[#1E2A36] px-3 py-1 ml-2 hover:bg-[#22D3EE] hover:text-[#07090C] transition-colors">[ EXECUTE ]</button>
    </div>
  </footer>

  <!-- LEFT DRAWER (QUERY LOG) -->
  <div id="drawer-log" class="drawer">
    <div class="h-10 border-b border-[#1E2A36] flex items-center justify-between px-3 mono text-xs text-[#22D3EE] bg-[#090D13]">
      <span>[ QUERY LOG ]</span>
      <button id="btn-close-log" class="text-[#5C7080] hover:text-[#E2E8F0]">[ X ]</button>
    </div>
    <div class="flex-1 overflow-y-auto p-2" id="log-list">
      <!-- Log items injected via JS -->
      <div class="mono text-[10px] text-[#5C7080] text-center mt-4">NO PREVIOUS QUERIES</div>
    </div>
  </div>
  
  <!-- Overlay for drawer -->
  <div id="overlay" class="fixed inset-0 bg-black/50 z-40 hidden"></div>

<script>
(() => {
  // --- DOM Elements ---
  const $ = id => document.getElementById(id);
  const workspace = $('workspace'), emptyState = $('empty-state');
  const reportPanel = $('report-panel'), errorPanel = $('error-panel');
  const input = $('cmd-input'), btnExec = $('btn-exec');
  const drawer = $('drawer-log'), overlay = $('overlay');
  const logList = $('log-list');
  
  // State
  let isLoading = false;
  let history = [];
  let currentQuery = '';
  
  // --- Initialize Markdown ---
  marked.setOptions({ breaks: true, gfm: true });

  // --- Telemetry Time ---
  setInterval(() => {
    const now = new Date();
    $('telemetry-time').textContent = now.toTimeString().split(' ')[0];
  }, 1000);

  // --- Drawer Logic ---
  const toggleDrawer = (open) => {
    drawer.classList.toggle('open', open);
    overlay.classList.toggle('hidden', !open);
  };
  $('btn-log').addEventListener('click', () => toggleDrawer(true));
  $('btn-close-log').addEventListener('click', () => toggleDrawer(false));
  overlay.addEventListener('click', () => toggleDrawer(false));

  // --- Render Functions ---
  function generateID() {
    return Math.random().toString(36).substring(2, 7).toUpperCase();
  }

  function formatTime() {
    const d = new Date();
    return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
  }

  function renderReport(query, data) {
    emptyState.classList.add('hidden');
    errorPanel.classList.add('hidden');
    reportPanel.classList.remove('hidden');
    reportPanel.classList.add('flex');

    $('report-id').textContent = generateID();
    $('report-time').textContent = formatTime();
    $('report-query').textContent = query;
    
    // Render Markdown safely
    const rawHTML = marked.parse(data.answer || 'Tiada jawapan.');
    $('report-answer').innerHTML = DOMPurify.sanitize(rawHTML, { FORBID_TAGS: ['style', 'img'] });

    // Render Evidence
    const srcContainer = $('report-sources');
    srcContainer.innerHTML = '';
    
    if (data.sources && data.sources.length > 0) {
      $('telemetry-src').textContent = `SRC: ${data.sources.length}`;
      data.sources.forEach(src => {
        // Parse "filename.txt (0.85)"
        const match = src.match(/^(.*?)\s*\((\d*\.?\d+)\)\s*$/);
        const name = match ? match[1] : src;
        const score = match ? match[2] : '---';
        
        const row = document.createElement('div');
        row.className = 'evidence-row';
        row.innerHTML = `<span class="text-[#E2E8F0]">> FILE: ${name}</span><span class="text-[#22D3EE]">[CONF: ${score}]</span>`;
        srcContainer.appendChild(row);
      });
    } else {
      $('telemetry-src').textContent = `SRC: 0`;
      srcContainer.innerHTML = `<div class="mono text-[10px] text-[#5C7080]">NO EVIDENCE FOUND</div>`;
    }
    
    // Scroll to top to see report header
    workspace.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderError(msg) {
    emptyState.classList.add('hidden');
    reportPanel.classList.add('hidden');
    reportPanel.classList.remove('flex');
    errorPanel.classList.remove('hidden');
    errorPanel.classList.add('flex');
    
    $('error-msg').textContent = msg;
  }

  function addToLog(query) {
    // Remove empty state from log if exists
    if (logList.querySelector('.text-center')) logList.innerHTML = '';
    
    history.unshift({ q: query, time: formatTime(), id: generateID() });
    
    // Re-render log list
    logList.innerHTML = '';
    history.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'w-full text-left p-2 border-b border-[#1E2A36] hover:bg-[#1E2A36] transition-colors group';
      btn.innerHTML = `
        <div class="mono text-[10px] text-[#22D3EE] mb-1">> ${item.q.substring(0, 30)}${item.q.length > 30 ? '...' : ''}</div>
        <div class="mono text-[9px] text-[#5C7080]">${item.time} · ${item.id}</div>
      `;
      btn.onclick = () => {
        input.value = item.q;
        toggleDrawer(false);
        executeQuery(item.q); // re-run
      };
      logList.appendChild(btn);
    });
  }

  // --- Fetch Logic ---
  async function executeQuery(q) {
    if (!q.trim() || isLoading) return;
    
    isLoading = true;
    currentQuery = q;
    input.value = '';
    input.placeholder = 'PROCESSING...';
    
    // Show immediate loading state in panel
    emptyState.classList.add('hidden');
    errorPanel.classList.add('hidden');
    reportPanel.classList.remove('hidden');
    reportPanel.classList.add('flex');
    $('report-query').textContent = q;
    $('report-answer').innerHTML = '<div class="mono text-[#22D3EE] animate-pulse">> RETRIEVING DATA...</div>';
    $('report-sources').innerHTML = '';
    
    try {
      const res = await fetch(`/api/query?q=${encodeURIComponent(q)}`);
      const data = await res.json();
      
      if (!res.ok || data.error) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      
      renderReport(q, data);
      addToLog(q);
      
    } catch (e) {
      renderError(e.message || 'NETWORK FAILURE');
    } finally {
      isLoading = false;
      input.placeholder = 'enter query...';
      input.focus();
    }
  }

  // --- Event Listeners ---
  btnExec.addEventListener('click', () => executeQuery(input.value));
  
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      executeQuery(input.value);
    }
  });

  // Escape key to close drawer
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') toggleDrawer(false);
  });

  // Copy Button
  $('btn-copy').addEventListener('click', () => {
    const txt = $('report-answer').innerText;
    navigator.clipboard.writeText(txt).then(() => {
      const btn = $('btn-copy');
      btn.textContent = '[ COPIED ]';
      setTimeout(() => btn.textContent = '[ COPY ]', 1500);
    });
  });

  // Re-run Button
  $('btn-rerun').addEventListener('click', () => {
    if (currentQuery) executeQuery(currentQuery);
  });

})();
</script>
</body>
</html>
